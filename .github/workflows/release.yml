name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

env:
  JUCE_VERSION: 9.0.2

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check out JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: .ci/JUCE
          fetch-depth: 1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev

      - name: Install WebView2 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP\Microsoft.Web.WebView2.zip"
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40" `
            -OutFile $package
          Expand-Archive -Path $package -DestinationPath "$env:RUNNER_TEMP\WebView2"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ccache
        shell: bash
        run: |
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --yes ccache
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install ccache
          else
            choco install ccache --no-progress --yes
          fi

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: electrobow-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}
          restore-keys: |
            electrobow-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: electrobow-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-juce-${{ env.JUCE_VERSION }}-${{ hashFiles('CMakeLists.txt', 'build.py') }}
          restore-keys: |
            electrobow-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-juce-${{ env.JUCE_VERSION }}-

      - name: Build Windows VST3
        if: matrix.name == 'windows'
        run: python build.py .ci/JUCE --config Release --cmake-arg CMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg CMAKE_CXX_COMPILER_LAUNCHER=ccache --cmake-arg "JUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP\WebView2"

      - name: Build Linux VST3
        if: matrix.name == 'linux'
        run: python build.py .ci/JUCE --config Release --cmake-arg CMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build universal macOS VST3
        if: matrix.name == 'macos'
        run: python build.py .ci/JUCE --config Release --cmake-arg "CMAKE_OSX_ARCHITECTURES=arm64;x86_64" --cmake-arg CMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package VST3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          vst3_dir="$(find build/ElectroBow_artefacts -type d -name VST3 -print -quit)"
          test -n "$vst3_dir"
          cp -R "$vst3_dir" package/

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectroBow-vst3-${{ matrix.name }}
          path: package/VST3
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for artifact in dist/*; do
            archive="$(basename "$artifact").zip"
            (cd "$artifact" && zip -r "$GITHUB_WORKSPACE/$archive" .)
          done
          test -f ElectroBow-vst3-windows.zip
          test -f ElectroBow-vst3-macos.zip
          test -f ElectroBow-vst3-linux.zip

      - name: Extract changelog section
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md

          awk -v version="$version" '
            index($0, "## [" version "] -") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest \
            --title "ElectroBow $version" \
            --notes-file release-notes.md \
            ElectroBow-vst3-windows.zip \
            ElectroBow-vst3-macos.zip \
            ElectroBow-vst3-linux.zip
