name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

env:
  JUCE_VERSION: 9.0.2
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  CCACHE_COMPILERCHECK: content

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Check Rust formatting and lints
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --offline -- -D warnings

      - name: Check out JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: .ci/JUCE
          fetch-depth: 1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # Azure's Ubuntu mirror has delivered packages at ~57 KB/s in CI.
          # Replace it in both mirror-list and direct-source runner layouts.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          # Bound stalled mirror connections and retry transient download errors.
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o APT::Update::Error-Mode=any
          )
          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install --yes --no-install-recommends \
            ccache \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev

      - name: Install WebView2 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP\Microsoft.Web.WebView2.zip"
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40" `
            -OutFile $package
          $packageRoot = "$env:RUNNER_TEMP\WebView2"
          $packageDir = "$packageRoot\Microsoft.Web.WebView2.1.0.2903.40"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Expand-Archive -Path $package -DestinationPath $packageDir
          "WEBVIEW2_PACKAGE_LOCATION=$($packageRoot.Replace('\', '/'))" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ccache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install ccache
          fi

      # Cache compiler results only. Generated CMake trees embed absolute SDK,
      # compiler and CMake paths and cannot survive hosted-runner image changes.
      - name: Cache compiler outputs
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: electrobow-ccache-v2-${{ runner.os }}-${{ runner.arch }}-juce-${{ env.JUCE_VERSION }}-${{ github.sha }}
          restore-keys: |
            electrobow-ccache-v2-${{ runner.os }}-${{ runner.arch }}-juce-${{ env.JUCE_VERSION }}-

      - name: Report build tools
        shell: bash
        run: |
          cmake --version
          rustc -vV
          node --version
          python --version

      - name: Build Windows VST3
        if: matrix.name == 'windows'
        timeout-minutes: 30
        run: python build.py .ci/JUCE --config Release --cmake-arg "JUCE_WEBVIEW2_PACKAGE_LOCATION=$env:WEBVIEW2_PACKAGE_LOCATION"

      - name: Build Linux VST3
        if: matrix.name == 'linux'
        timeout-minutes: 30
        run: python build.py .ci/JUCE --config Release --cmake-arg CMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build universal macOS VST3
        if: matrix.name == 'macos'
        timeout-minutes: 30
        run: python build.py .ci/JUCE --config Release --cmake-arg "CMAKE_OSX_ARCHITECTURES=arm64;x86_64" --cmake-arg CMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run tests
        timeout-minutes: 10
        run: ctest --test-dir build --build-config Release --verbose --timeout 180 --no-tests=error

      - name: Report compiler cache
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-logs-${{ matrix.name }}
          path: build/Testing/Temporary/*.log
          if-no-files-found: ignore


      - name: Package VST3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          vst3_bundle="$(find build/ElectroBow_artefacts -type d -name '*.vst3' -print -quit)"
          test -n "$vst3_bundle"
          cp -R "$vst3_bundle" package/ElectroBow.vst3

          # A VST3 is a platform package, not a Windows .dll.  Check the
          # platform-specific payload so a release cannot be published with
          # only the wrapper directory or an empty artifact.
          test -d package/ElectroBow.vst3
          case "${{ matrix.name }}" in
            windows)
              test -f package/ElectroBow.vst3/Contents/x86_64-win/ElectroBow.vst3
              ;;
            macos)
              test -f package/ElectroBow.vst3/Contents/MacOS/ElectroBow
              ;;
            linux)
              test -f package/ElectroBow.vst3/Contents/x86_64-linux/ElectroBow.so
              ;;
          esac

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectroBow-vst3-${{ matrix.name }}
          path: package
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ElectroBow-vst3-*
          path: dist

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for artifact in dist/*; do
            archive="$(basename "$artifact").zip"
            (cd "$artifact" && zip -r "$GITHUB_WORKSPACE/$archive" .)
          done
          test -f ElectroBow-vst3-windows.zip
          test -f ElectroBow-vst3-macos.zip
          test -f ElectroBow-vst3-linux.zip
          unzip -Z1 ElectroBow-vst3-windows.zip | grep -Fx 'ElectroBow.vst3/Contents/x86_64-win/ElectroBow.vst3'

      - name: Extract changelog section
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md

          awk -v version="$version" '
            index($0, "## [" version "] -") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest \
            --title "ElectroBow $version" \
            --notes-file release-notes.md \
            ElectroBow-vst3-windows.zip \
            ElectroBow-vst3-macos.zip \
            ElectroBow-vst3-linux.zip
