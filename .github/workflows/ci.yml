name: Build and test

on:
  push:
  pull_request:

env:
  JUCE_VERSION: 9.0.2

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check out JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ env.JUCE_VERSION }}
          path: .ci/JUCE
          fetch-depth: 1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Install WebView2 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP\Microsoft.Web.WebView2.zip"
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40" `
            -OutFile $package
          Expand-Archive -Path $package -DestinationPath "$env:RUNNER_TEMP\WebView2"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ccache
        shell: bash
        run: |
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --yes ccache
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install ccache
          else
            choco install ccache --no-progress --yes
          fi

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: electrobow-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}
          restore-keys: |
            electrobow-ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: electrobow-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-juce-${{ env.JUCE_VERSION }}-${{ hashFiles('CMakeLists.txt', 'build.py') }}
          restore-keys: |
            electrobow-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-juce-${{ env.JUCE_VERSION }}-

      - name: Build Windows
        if: matrix.name == 'windows'
        run: python build.py .ci/JUCE --config Release --cmake-arg CMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg CMAKE_CXX_COMPILER_LAUNCHER=ccache --cmake-arg "JUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP\WebView2"

      - name: Build Linux
        if: matrix.name == 'linux'
        run: python build.py .ci/JUCE --config Release --cmake-arg CMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build universal macOS plugin
        if: matrix.name == 'macos'
        run: python build.py .ci/JUCE --config Release --cmake-arg "CMAKE_OSX_ARCHITECTURES=arm64;x86_64" --cmake-arg CMAKE_C_COMPILER_LAUNCHER=ccache --cmake-arg CMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure
