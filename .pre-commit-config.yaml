minimum_pre_commit_version: '4.6.0'
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^ThirdParty/

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: Format C/C++
        entry: python tools/hooks/format_files.py clang-format
        language: python
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
      - id: rustfmt
        name: Format Rust
        entry: python tools/hooks/format_files.py rustfmt
        language: python
        types: [rust]
      - id: prettier
        name: Format UI
        entry: python tools/hooks/format_files.py prettier
        language: python
        files: ^UI/.*\.(css|html|js|jsx|json|ts|tsx)$
      - id: tag-changelog
        name: Check pushed tags against their committed changelogs
        entry: python tools/hooks/check_tag_changelog.py
        language: python
        stages: [pre-push]
        always_run: true
        pass_filenames: false
